[project]
name = "hiver-support-agent"
version = "0.1.0"
description = "Offline evaluation of a retrieval-grounded Twitter support drafting agent."
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
  "numpy>=2.0,<3",
  "scikit-learn>=1.5,<2",
  "pydantic>=2.8,<3",
  "rank-bm25>=0.2.2,<1",
  "matplotlib>=3.9,<4",
  "google-genai>=1.0,<2",
  "groq>=0.11,<1",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["src"]

[dependency-groups]
dev = ["pytest>=8.3,<9", "ruff>=0.8,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
